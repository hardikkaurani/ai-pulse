services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aipulse-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=ai-pulse-production-secret-key-change-in-prod
      - DATABASE_URL=sqlite:///./aipulse.db
      - AI_MODE=mock
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: aipulse-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
