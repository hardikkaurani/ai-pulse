services:
  - type: web
    name: ai-pulse-reviewer
    runtime: docker
    plan: free
    region: singapore
    branch: feat/client-pilot
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-pulse-reviewer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: AI_MODE
        value: live
      - key: LLM_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_API_KEY
        sync: false
databases:
  - name: ai-pulse-reviewer-db
    plan: free
    region: singapore
    databaseName: aipulse
    user: aipulse
    ipAllowList: []
